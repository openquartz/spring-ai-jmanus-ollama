server:
  port: 18080
spring:
  application:
    name: spring-ai-jmanus-ollama
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          # ollama 模型
          model: qwen3:8b
          temperature: 0.9
    mcp:
      client:
        enabled: false
  # Hikari Configuration
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: Spring-AI-Alibaba-JManus-${spring.profiles.active}-Pool
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  file:
    name: ./logs/info.log
  level:
    root: INFO
    # ai 框架 使用 debug。可以查看模型调用日志提示词等
    org.springframework.ai: DEBUG
